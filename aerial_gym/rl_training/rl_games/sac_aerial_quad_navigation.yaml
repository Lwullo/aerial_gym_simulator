params:
  seed: 10
  algo:
    name: sac

  model:
    name: soft_actor_critic

  load_checkpoint: False

  network:
    name: soft_actor_critic
    separate: True
    space:
      continuous:
    mlp:
      units: [256, 128, 64]
      activation: elu
      initializer:
        name: default
    log_std_bounds: [-5, 2]

  config:
    env_name: navigation_task_gmm_noise
    env_config:
      num_envs: 1024

    # Keep SAC fully decoupled from PPO: only SAC config enables the augmented observation.
    task_overrides:
      use_wind_estimation_features: True
      observation_space_dim: 31

    name: sac_gmm_noise_run
    device: cuda:0
    normalize_input: True
    reward_shaper:
      scale_value: 0.1

    max_epochs: 10000
    save_frequency: 10
    save_best_after: 10

    gamma: 0.99
    init_alpha: 0.2
    alpha_lr: 3e-4
    actor_lr: 3e-4
    critic_lr: 3e-4
    critic_tau: 0.005
    batch_size: 2048
    learnable_temperature: True
    num_warmup_steps: 50
    replay_buffer_size: 1000000
    num_steps_per_episode: 64
    num_actors: 1024

    player:
      render: True
      deterministic: True
      games_num: 100000
