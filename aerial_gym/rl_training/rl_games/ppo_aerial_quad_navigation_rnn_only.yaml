params:  
  seed: 10
  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd
  
  load_checkpoint: False

  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    mlp:
      units: []
      d2rl: False
      activation: elu
      initializer:
        name: default
        scale: 2
    rnn:
      name: gru
      units: 64
      layers: 1
      before_mlp: False
      layer_norm: True
  config:
    env_name: navigation_task_gmm_noise
    env_config:
      num_envs: 1024
      
    name: rnn_only_gmm_noise_run
    reward_shaper:
      # min_val: -1
      scale_value: 0.1

    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    ppo: True
    learning_rate: 5e-5
    lr_schedule: adaptive
    kl_threshold: 0.007
    save_frequency: 10
    save_best_after: 10
    score_to_win: 100000
    grad_norm: 1.0
    entropy_coef: 0.003
    truncate_grads: True
    e_clip: 0.15
    clip_value: False
    num_actors: 1024
    horizon_length: 32
    minibatch_size: 2048
    mini_epochs: 2
    critic_coef: 2
    normalize_input: True  # [ENABLED] Normalize observations for stable training
    seq_length: 8
    bounds_loss_coef: 0.0005
    max_epochs: 10000
    normalize_value: True
    use_diagnostics: True
    value_bootstrap: True
    #weight_decay: 0.0001
    use_smooth_clamp: False

    player:
      render: True
      deterministic: True
      games_num: 100000
